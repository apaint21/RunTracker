<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Run Log</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
:root{--bg:#0E0F0C;--surface:#17190F;--border:#2A2E1E;--text:#ECEEE4;--dim:#8C9080;--accent:#B6FF3B;--adim:rgba(182,255,59,.12)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans',sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:480px;margin:auto;padding:20px 16px 86px}
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0}h1{font-size:24px;font-weight:600}h2{font-size:15.5px;margin-bottom:10px}h3{font-size:16.5px}.sub,.run-date,.run-notes,.pr-label,.pr-pace,.chart-tick{color:var(--dim)}.sub{font-size:13px;margin:4px 0}
.top,.hero-top,.section-head,.calendar-head,.modal-head{display:flex;justify-content:space-between}.top{align-items:flex-start;margin-bottom:20px;gap:10px}
.btn,.text-input,.chart-option{font-family:inherit;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text)}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 14px;font-size:13.5px;cursor:pointer;min-height:40px}.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}.btn-ghost{color:var(--dim)}.btn-sm{padding:7px 11px;font-size:12.5px;min-height:34px}
.btn-icon,.link{background:none;border:0;color:var(--dim);cursor:pointer}.btn-icon{display:inline-flex;align-items:center;justify-content:center;padding:6px;min-width:32px;min-height:32px}.link{font:12.5px inherit;display:inline-flex;align-items:center;gap:5px;padding:0;min-height:32px}
.card,.calendar,.chart-wrap,.pr-card{background:var(--surface);border:1px solid var(--border);border-radius:12px}.card{padding:18px 16px}.hero{margin-bottom:24px}.hero-top{align-items:flex-end;gap:8px;flex-wrap:wrap}.hero-number{font:700 40px/1 'Space Grotesk'}.hero-unit{font-size:18px;color:var(--dim)}.hero-label{color:var(--dim);font-size:12.5px;margin-top:4px}.streak{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px}
.lane{margin-top:16px;height:8px;border-radius:99px;background:#23261A;overflow:hidden}.lane-fill{height:100%;background:linear-gradient(90deg,var(--accent),#E8FFA0);border-radius:99px}.lane-caption{margin-top:9px;font-size:12.5px}
.block{margin-bottom:24px}.section-head{align-items:center;margin-bottom:10px}
.calendar{padding:16px 10px 12px}.calendar-head{align-items:center;margin-bottom:12px}.calendar-title{font:600 15px 'Space Grotesk'}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar-weekday{text-align:center;color:var(--dim);font-size:10px;padding-bottom:4px}.calendar-day{height:42px;min-height:42px;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:7px;font-size:12px}.calendar-day.empty-day{visibility:hidden}.calendar-day.today{border-color:var(--border)}.calendar-day.has-run{color:var(--accent);font-weight:600}.calendar-check{position:absolute;right:4px;bottom:3px;width:13px;height:13px;color:var(--accent)}
.chart-wrap{padding:16px 10px 10px}.chart-controls{display:flex;gap:6px;margin-bottom:14px}.chart-option{flex:1;min-height:34px;font-size:12px;cursor:pointer;color:var(--dim)}.chart-option.active{background:var(--adim);border-color:var(--accent);color:var(--accent)}.chart{display:flex;align-items:flex-end;gap:6px;height:130px}.chart-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;min-width:0}.chart-bar{width:100%;max-width:22px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}.chart-tick{font-size:9.5px;margin-top:6px;white-space:nowrap}
.empty{color:var(--dim);font-size:13.5px;padding:20px;border:1px dashed var(--border);border-radius:10px;text-align:center}.run-list{display:flex;flex-direction:column;border-top:1px solid var(--border)}.run-row{display:grid;grid-template-columns:42px 1fr auto auto 64px;gap:8px;align-items:center;padding:12px 2px;border-bottom:1px solid var(--border);font-size:13px}.run-date{font-size:11.5px}.run-main{display:flex;flex-direction:column;min-width:0}.run-dist{font:600 14px 'Space Grotesk'}.run-notes{font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:34vw}.run-time{font-size:12.5px;text-align:right}.run-pace{color:var(--accent);font-size:11px;text-align:right}.run-actions{display:flex;justify-content:flex-end}
.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pr-card{position:relative;padding:14px 12px;border-radius:10px}.pr-label{font-size:11.5px;margin-bottom:6px}.pr-time{background:none;border:0;font:600 20px 'Space Grotesk';color:var(--text);cursor:pointer;padding:0;text-align:left;min-height:28px}.pr-pace{font-size:11px;margin-top:4px}.pr-delete{position:absolute;top:6px;right:6px;opacity:.4}
.inline-form{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:10px}.text-input{padding:9px 10px;font-size:14px;flex:1;min-width:90px;min-height:40px}.text-input:focus{outline:none;border-color:var(--accent)}.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;font-size:12px;color:var(--dim)}.field-row{display:flex;gap:10px}.field-row .field{flex:1}
.overlay{position:fixed;inset:0;background:rgba(4,5,3,.7);display:flex;align-items:flex-end;justify-content:center;z-index:50}.modal{background:var(--surface);border:1px solid var(--border);border-radius:16px 16px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));width:100%;max-width:480px}.modal-head{align-items:center;margin-bottom:16px}.modal-actions{display:flex;justify-content:flex-end;gap:8px}.error{color:var(--accent);font-size:12.5px;margin-bottom:8px}.footer-row{display:flex;justify-content:center;gap:14px;margin-top:8px}
.bottom-nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:rgba(14,15,12,.97);border-top:1px solid var(--border)}.bottom-nav-inner{max-width:480px;margin:auto;height:64px;display:grid;grid-template-columns:repeat(3,1fr)}.nav-btn{border:0;background:none;color:var(--dim);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font:10px inherit;cursor:pointer}.nav-btn.active{color:var(--accent)}.nav-btn svg{width:19px;height:19px}svg{display:block}
@media(max-width:380px){.run-row{grid-template-columns:38px 1fr auto 58px}.run-pace{display:none}}
</style>
</head>
<body>
<div id="app"></div>

<script>
const DEFAULT_PRS=[
{id:"pr-mile",label:"Mile",distance:1,timeSec:null},
{id:"pr-15",label:"1.5 mi",distance:1.5,timeSec:null},
{id:"pr-2",label:"2 mi",distance:2,timeSec:null},
{id:"pr-5k",label:"5K",distance:3.10686,timeSec:null}
];
const LS={runs:"runtracker_runs",prs:"runtracker_prs",goal:"runtracker_goal"};
const DAY=86400000;

let state={
runs:load(LS.runs,[]),prs:load(LS.prs,DEFAULT_PRS),goal:load(LS.goal,20),
page:"home",chartRange:"10w",
calendarMonth:new Date().getMonth(),calendarYear:new Date().getFullYear(),
showAddRun:false,showAddPr:false,
editingGoal:false,editingPrId:null,editingRunId:null,error:""
};

function load(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):f}catch{return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
function setState(p){state={...state,...p};render()}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function date(d){return d.toISOString().slice(0,10)}
function today(){return date(new Date())}
function week(s){let d=new Date(s+"T00:00:00"),n=d.getDay();d.setDate(d.getDate()-(n+6)%7);return date(d)}
function time(s){
 if(!s)return null;
 let p=s.trim().split(":").map(Number);if(p.some(isNaN))return null;
 let x=p.length===3?p[0]*3600+p[1]*60+p[2]:p.length===2?p[0]*60+p[1]:p[0];
 return x>0?Math.round(x):null
}
function fmt(x){if(x==null||isNaN(x))return"—";x=Math.round(x);let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
function pace(t,d){return t&&d?fmt(t/d)+"/mi":"—"}
function streak(){
 let set=new Set(state.runs.map(r=>r.date)),d=new Date(today()+"T00:00:00");
 if(!set.has(date(d))){d.setTime(d.getTime()-DAY);if(!set.has(date(d)))return 0}
 let n=0;while(set.has(date(d))){n++;d.setTime(d.getTime()-DAY)}return n
}

function addRun(r){state.runs.unshift({...r,id:"run-"+Date.now()});save(LS.runs,state.runs);setState({showAddRun:false,error:""})}
function updateRun(id,r){state.runs=state.runs.map(x=>x.id===id?{...x,...r}:x);save(LS.runs,state.runs);setState({editingRunId:null,error:""})}
function deleteRun(id){state.runs=state.runs.filter(r=>r.id!==id);save(LS.runs,state.runs);render()}
function addPr(p){state.prs.push({...p,id:"pr-"+Date.now()});save(LS.prs,state.prs);setState({showAddPr:false})}
function updatePr(id,t){state.prs=state.prs.map(p=>p.id===id?{...p,timeSec:t}:p);save(LS.prs,state.prs);setState({editingPrId:null})}
function deletePr(id){state.prs=state.prs.filter(p=>p.id!==id);save(LS.prs,state.prs);render()}
function setGoal(v){state.goal=v;save(LS.goal,v);setState({editingGoal:false})}

function exportData(){
 let a=document.createElement("a"),u=URL.createObjectURL(new Blob([JSON.stringify({runs:state.runs,prs:state.prs,goal:state.goal,exportedAt:new Date().toISOString()},null,2)],{type:"application/json"}));
 a.href=u;a.download=`run-log-${today()}.json`;a.click();URL.revokeObjectURL(u)
}

function importData(file){
 if(!file)return;
 let r=new FileReader();
 r.onload=e=>{
  try{
   let d=JSON.parse(e.target.result);if(!d||typeof d!=="object")throw 0;
   if(Array.isArray(d.runs)){state.runs=d.runs.map((x,i)=>({...x,id:x.id||`run-${Date.now()}-${i}`}));save(LS.runs,state.runs)}
   if(Array.isArray(d.prs)){
    state.prs=d.prs.map((p,i)=>({
     id:p.id||`pr-${Date.now()}-${i}`,label:String(p.label??""),
     distance:Number(p.distance)||0,timeSec:p.timeSec==null||p.timeSec===""?null:Number(p.timeSec)
    })).filter(p=>p.label&&p.distance>0);save(LS.prs,state.prs)
   }
   if(typeof d.goal==="number"){state.goal=d.goal;save(LS.goal,state.goal)}
   render()
  }catch{alert("That file couldn't be read as a run log export.")}
 };
 r.readAsText(file)
}

function render(){
 let app=document.getElementById("app");
 app.innerHTML=state.page==="home"?home():state.page==="history"?history():prs();
 app.innerHTML+=nav();
 if(state.showAddRun||state.editingRunId)app.innerHTML+=runModal()
}

function home(){
 let start=week(today()),m=state.runs.filter(r=>week(r.date)===start).reduce((s,r)=>s+Number(r.distance||0),0),pct=state.goal?Math.min(100,m/state.goal*100):0,s=streak();
 return `<header class="top"><div><h1>Run log</h1><p class="sub">Track distance, pace, and personal bests.</p></div><button class="btn btn-primary" onclick="setState({showAddRun:true})">${plus()} Log a run</button></header>
 ${calendar()}
 <section class="card hero"><div class="hero-top"><div><div class="hero-number">${m.toFixed(1)} <span class="hero-unit">mi</span></div><div class="hero-label">this week</div></div>${s?`<div class="streak">${flame()} ${s} day${s===1?"":"s"} running</div>`:""}</div>
 <div class="lane"><div class="lane-fill" style="width:${pct}%"></div></div>
 <div class="lane-caption">${state.editingGoal?goalEdit():`<button class="link" onclick="setState({editingGoal:true})">goal: ${state.goal} mi/week ${pencil()}</button>`}</div></section>`
}

function changeMonth(n){
 let d=new Date(state.calendarYear,state.calendarMonth+n,1);
 setState({calendarMonth:d.getMonth(),calendarYear:d.getFullYear()})
}

function calendar(){
 let y=state.calendarYear,m=state.calendarMonth,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7,set=new Set(state.runs.map(r=>r.date)),cells="";

 for(let i=0;i<off;i++)cells+=`<div class="calendar-day empty-day"></div>`;

 for(let d=1;d<=days;d++){
  let x=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,run=set.has(x);
  cells+=`<div class="calendar-day ${run?"has-run":""} ${x===today()?"today":""}">${d}${run?`<span class="calendar-check">${check(13)}</span>`:""}</div>`
 }

 let title=new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});

 return `<section class="block"><div class="calendar"><div class="calendar-head"><button class="btn-icon" onclick="changeMonth(-1)">‹</button><div class="calendar-title">${title}</div><button class="btn-icon" onclick="changeMonth(1)">›</button></div><div class="calendar-weekdays">${"MTWTFSS".split("").map(x=>`<div class="calendar-weekday">${x}</div>`).join("")}</div><div class="calendar-grid">${cells}</div></div></section>`
}

function history(){
 let runs=[...state.runs].sort((a,b)=>b.date.localeCompare(a.date)),c=chart();
 return `<header class="top"><div><h1>History</h1><p class="sub">Mileage and logged runs.</p></div><button class="btn btn-primary" onclick="setState({showAddRun:true})">${plus()} Log a run</button></header>
 <section class="block"><h2>Mileage</h2><div class="chart-wrap"><div class="chart-controls">${["10w","3m","1y"].map((x,i)=>`<button class="chart-option ${state.chartRange===x?"active":""}" onclick="setState({chartRange:'${x}'})">${["10 weeks","3 months","1 year"][i]}</button>`).join("")}</div>
 <div class="chart">${c.data.map(x=>`<div class="chart-col"><div class="chart-bar" style="height:${Math.max(2,x.miles/c.max*100)}%" title="${x.miles} mi"></div><div class="chart-tick">${x.label}</div></div>`).join("")}</div></div></section>
 <section class="block"><h2>Recent runs</h2>${runs.length?`<div class="run-list">${runs.map(runRow).join("")}</div>`:`<div class="empty">No runs logged yet.</div>`}</section>
 <div class="footer-row"><button class="link" onclick="exportData()">${download()} export data</button><button class="link" onclick="document.getElementById('import').click()">${upload()} import data</button><input id="import" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></div>`
}

function chart(){
 let b={},range=state.chartRange;
 if(range==="10w"){
  for(let i=9;i>=0;i--){let d=new Date();d.setDate(d.getDate()-i*7);b[week(date(d))]=0}
  state.runs.forEach(r=>{let k=week(r.date);if(k in b)b[k]+=+r.distance||0});
  let data=Object.entries(b).map(([k,v])=>({label:new Date(k+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"}),miles:+v.toFixed(1)}));
  return{data,max:Math.max(1,...data.map(x=>x.miles))}
 }
 let count=range==="3m"?3:12;
 for(let i=count-1;i>=0;i--){let d=new Date();d.setMonth(d.getMonth()-i,1),k=d.toISOString().slice(0,7);b[k]=0}
 state.runs.forEach(r=>{let k=r.date.slice(0,7);if(k in b)b[k]+=+r.distance||0});
 let data=Object.entries(b).map(([k,v])=>({label:new Date(k+"-01T00:00:00").toLocaleDateString(undefined,{month:"short"}),miles:+v.toFixed(1)}));
 return{data,max:Math.max(1,...data.map(x=>x.miles))}
}

function prs(){
 return `<header class="top"><div><h1>Personal bests</h1><p class="sub">Track your fastest times.</p></div></header>
 <section class="block"><div class="section-head"><h2>Personal bests</h2><button class="link" onclick="setState({showAddPr:true})">${plus(13)} add distance</button></div>
 <div class="pr-grid">${state.prs.map(prCard).join("")}</div>${state.showAddPr?addPrForm():""}</section>
 <div class="footer-row"><button class="link" onclick="exportData()">${download()} export data</button><button class="link" onclick="document.getElementById('pr-import').click()">${upload()} import data</button><input id="pr-import" type="file" accept="application/json" hidden onchange="importData(this.files[0])"></div>`
}

function goalEdit(){
 return `<span style="display:inline-flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px">goal:<input id="goal" type="number" min="0" step=".5" value="${state.goal}" class="text-input" style="width:60px;min-height:30px;padding:4px 6px;font-size:12.5px">mi/week<button class="btn-icon" onclick="setGoal(Number(document.getElementById('goal').value)||0)">${check()}</button><button class="btn-icon" onclick="setState({editingGoal:false})">${x()}</button></span>`
}

function prCard(p){
 if(state.editingPrId===p.id)return `<div class="pr-card"><button class="btn-icon pr-delete" onclick="deletePr('${p.id}')">${x(12)}</button><div class="pr-label">${esc(p.label)}</div><input class="text-input" id="pri-${p.id}" placeholder="mm:ss" value="${p.timeSec?fmt(p.timeSec):""}" style="width:100%;font-size:15px;padding:6px 8px;min-height:34px;margin-bottom:6px"><div><button class="btn-icon" onclick="let s=time(document.getElementById('pri-${p.id}').value);if(s)updatePr('${p.id}',s)">${check()}</button><button class="btn-icon" onclick="setState({editingPrId:null})">${x()}</button></div></div>`;
 return `<div class="pr-card"><button class="btn-icon pr-delete" onclick="deletePr('${p.id}')">${x(12)}</button><div class="pr-label">${esc(p.label)}</div><button class="pr-time" onclick="setState({editingPrId:'${p.id}'})">${fmt(p.timeSec)}</button><div class="pr-pace">${p.timeSec?"pace "+pace(p.timeSec,p.distance):"tap to set"}</div></div>`
}

function addPrForm(){
 return `<div class="inline-form"><input class="text-input" id="pname" placeholder="Distance name (e.g. 10K)"><input class="text-input" id="pdist" type="number" step=".01" placeholder="Miles" style="width:90px;flex:none"><input class="text-input" id="ptime" placeholder="mm:ss (optional)" style="width:110px;flex:none"><button class="btn btn-primary btn-sm" onclick="newPr()">Add</button><button class="btn btn-ghost btn-sm" onclick="setState({showAddPr:false})">Cancel</button></div>`
}
function newPr(){let label=document.getElementById("pname").value.trim(),distance=+document.getElementById("pdist").value;if(label&&distance>0)addPr({label,distance,timeSec:time(document.getElementById("ptime").value)})}

function runRow(r){
 let d=new Date(r.date+"T00:00:00");
 return `<div class="run-row"><div class="run-date">${d.toLocaleDateString(undefined,{month:"short",day:"numeric"})}</div><div class="run-main"><div class="run-dist">${r.distance} mi</div>${r.notes?`<div class="run-notes">${esc(r.notes)}</div>`:""}</div><div class="run-time">${fmt(r.timeSec)}</div><div class="run-pace">${pace(r.timeSec,r.distance)}</div><div class="run-actions"><button class="btn-icon" onclick="setState({editingRunId:'${r.id}'})">${pencil(14)}</button><button class="btn-icon" onclick="deleteRun('${r.id}')">${trash()}</button></div></div>`
}

function runModal(){
 let edit=!!state.editingRunId,r=edit?state.runs.find(x=>x.id===state.editingRunId):null;if(edit&&!r)return"";
 return `<div class="overlay" onclick="if(event.target===this)setState({showAddRun:false,editingRunId:null,error:''})"><div class="modal"><div class="modal-head"><h3>${edit?"Edit run":"Log a run"}</h3><button class="btn-icon" onclick="setState({showAddRun:false,editingRunId:null,error:''})">${x()}</button></div>
 <label class="field"><span>Date</span><input id="rdate" type="date" class="text-input" value="${r?esc(r.date):today()}"></label>
 <div class="field-row"><label class="field"><span>Distance (mi)</span><input id="rdist" type="number" step=".01" class="text-input" placeholder="3.1" value="${r?esc(r.distance):""}"></label><label class="field"><span>Time</span><input id="rtime" class="text-input" placeholder="mm:ss" value="${r?fmt(r.timeSec):""}"></label></div>
 <label class="field"><span>Notes (optional)</span><input id="rnotes" class="text-input" placeholder="Easy shakeout, felt good" value="${r?esc(r.notes||""):""}"></label>${state.error?`<div class="error">${esc(state.error)}</div>`:""}
 <div class="modal-actions"><button class="btn btn-ghost" onclick="setState({showAddRun:false,editingRunId:null,error:''})">Cancel</button><button class="btn btn-primary" onclick="saveRun()">${edit?"Save changes":"Save run"}</button></div></div></div>`
}

function saveRun(){
 let r={date:document.getElementById("rdate").value,distance:+document.getElementById("rdist").value,timeSec:time(document.getElementById("rtime").value),notes:document.getElementById("rnotes").value.trim()};
 if(!r.date)return setState({error:"Add a date."});if(!r.distance||r.distance<=0)return setState({error:"Add a distance greater than 0."});if(!r.timeSec)return setState({error:"Add a time as mm:ss."});
 state.editingRunId?updateRun(state.editingRunId,r):addRun(r)
}

function nav(){
 return `<nav class="bottom-nav"><div class="bottom-nav-inner">${[
 ["home","Home",homeIcon()],["history","History",chartIcon()],["prs","PRs",trophy()]
 ].map(x=>`<button class="nav-btn ${state.page===x[0]?"active":""}" data-page="${x[0]}">${x[2]}<span>${x[1]}</span></button>`).join("")}</div></nav>`
}

document.addEventListener("click",e=>{let b=e.target.closest(".nav-btn");if(b)setState({page:b.dataset.page})});

function svg(path,size=14){return`<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`}
