<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Run Log</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

  :root {
    --bg: #0E0F0C;
    --surface: #17190F;
    --border: #2A2E1E;
    --text: #ECEEE4;
    --text-dim: #8C9080;
    --accent: #B6FF3B;
    --accent-dim: rgba(182, 255, 59, 0.12);
    --accent-text: #0E0F0C;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    max-width: 480px;
    margin: 0 auto;
    padding: 20px 16px 70px;
  }

  h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 24px;
    font-weight: 600;
    margin: 0;
    letter-spacing: -0.01em;
  }
  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 15.5px;
    font-weight: 600;
    margin: 0 0 10px;
  }
  .sub { color: var(--text-dim); font-size: 13px; margin: 4px 0 0; }

  header.top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 20px;
    gap: 10px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    padding: 10px 14px;
    cursor: pointer;
    min-height: 40px;
  }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn-ghost { color: var(--text-dim); }
  .btn-sm { padding: 7px 11px; font-size: 12.5px; min-height: 34px; }
  .btn-icon {
    background: none; border: none; color: var(--text-dim); cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 6px; border-radius: 6px; min-width: 32px; min-height: 32px;
  }
  .btn-icon:active { background: rgba(255,255,255,0.08); }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px;
  }

  .hero { margin-bottom: 20px; }
  .hero-top { display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 8px; }
  .hero-number {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 40px;
    font-weight: 700;
    line-height: 1;
  }
  .hero-unit { font-size: 18px; color: var(--text-dim); font-weight: 500; }
  .hero-label { color: var(--text-dim); font-size: 12.5px; margin-top: 4px; }
  .streak { display: flex; align-items: center; gap: 6px; color: var(--accent); font-size: 13px; font-weight: 500; }

  .lane { margin-top: 16px; height: 8px; border-radius: 999px; background: #23261A; overflow: hidden; }
  .lane-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #E8FFA0); border-radius: 999px; transition: width .4s ease; }
  .lane-caption { margin-top: 9px; font-size: 12.5px; }

  .link {
    background: none; border: none; color: var(--text-dim); font-size: 12.5px;
    font-family: 'IBM Plex Sans', sans-serif; display: inline-flex; align-items: center; gap: 5px;
    cursor: pointer; padding: 0; min-height: 32px;
  }

  section.block { margin-bottom: 24px; }
  .section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .section-head h2 { margin: 0; }

  .pr-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .pr-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 14px 12px; }
  .pr-label { font-size: 11.5px; color: var(--text-dim); margin-bottom: 6px; }
  .pr-time { background: none; border: none; font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 600; color: var(--text); cursor: pointer; padding: 0; text-align: left; min-height: 28px; }
  .pr-pace { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  .pr-delete { position: absolute; top: 6px; right: 6px; opacity: 0.4; }

  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 10px 10px; }
  .chart { display: flex; align-items: flex-end; gap: 6px; height: 130px; }
  .chart-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
  .chart-bar { width: 100%; max-width: 22px; background: var(--accent); border-radius: 3px 3px 0 0; min-height: 2px; }
  .chart-tick { font-size: 9.5px; color: var(--text-dim); margin-top: 6px; transform: rotate(0deg); white-space: nowrap; }

  .empty { color: var(--text-dim); font-size: 13.5px; padding: 20px; border: 1px dashed var(--border); border-radius: 10px; text-align: center; }

  .run-list { display: flex; flex-direction: column; border-top: 1px solid var(--border); }
  .run-row { display: grid; grid-template-columns: 42px 1fr auto auto 30px; gap: 8px; align-items: center; padding: 12px 2px; border-bottom: 1px solid var(--border); font-size: 13px; }
  .run-date { color: var(--text-dim); font-size: 11.5px; }
  .run-main { display: flex; flex-direction: column; }
  .run-dist { font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 14px; }
  .run-notes { color: var(--text-dim); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 34vw; }
  .run-time { color: var(--text); font-size: 12.5px; text-align: right; }
  .run-pace { color: var(--accent); font-size: 11px; text-align: right; }

  .inline-form { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; padding: 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  .text-input {
    background: var(--bg); border: 1px solid var(--border); border-radius: 7px; color: var(--text);
    padding: 9px 10px; font-family: 'IBM Plex Sans', sans-serif; font-size: 14px; flex: 1; min-width: 90px; min-height: 40px;
  }
  .text-input:focus { outline: none; border-color: var(--accent); }
  .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; font-size: 12px; color: var(--text-dim); }
  .field-row { display: flex; gap: 10px; }
  .field-row .field { flex: 1; }

  .overlay { position: fixed; inset: 0; background: rgba(4,5,3,0.7); display: flex; align-items: flex-end; justify-content: center; z-index: 50; }
  .modal { background: var(--surface); border: 1px solid var(--border); border-top-left-radius: 16px; border-top-right-radius: 16px; padding: 20px 18px calc(20px + env(safe-area-inset-bottom)); width: 100%; max-width: 480px; }
  .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .modal-head h3 { font-family: 'Space Grotesk', sans-serif; font-size: 16.5px; margin: 0; font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
  .error { color: var(--accent); font-size: 12.5px; margin-bottom: 8px; }

  .footer-row { display: flex; justify-content: center; gap: 14px; margin-top: 8px; }
  .footer-row .link { font-size: 12px; }

  svg { display: block; }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ---------- constants ----------
const DEFAULT_PRS = [
  { id: "pr-mile", label: "Mile", distance: 1, timeSec: null },
  { id: "pr-15", label: "1.5 mi", distance: 1.5, timeSec: null },
  { id: "pr-2", label: "2 mi", distance: 2, timeSec: null },
  { id: "pr-5k", label: "5K", distance: 3.10686, timeSec: null },
];
const DAY_MS = 86400000;
const LS_RUNS = "runtracker_runs";
const LS_PRS = "runtracker_prs";
const LS_GOAL = "runtracker_goal";

// ---------- state ----------
let state = {
  runs: loadLS(LS_RUNS, []),
  prs: loadLS(LS_PRS, DEFAULT_PRS),
  goal: loadLS(LS_GOAL, 20),
  showAddRun: false,
  showAddPr: false,
  editingGoal: false,
  editingPrId: null,
  addRunError: "",
};

function loadLS(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch { return fallback; }
}
function saveLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) { console.error("save failed", key, e); }
}

// ---------- helpers ----------
function parseTimeToSeconds(str) {
  if (!str) return null;
  const parts = str.trim().split(":").map(p => p.trim());
  if (parts.some(p => p === "" || isNaN(Number(p)))) return null;
  let sec = 0;
  if (parts.length === 3) sec = (+parts[0]) * 3600 + (+parts[1]) * 60 + (+parts[2]);
  else if (parts.length === 2) sec = (+parts[0]) * 60 + (+parts[1]);
  else if (parts.length === 1) sec = +parts[0];
  else return null;
  return sec > 0 ? Math.round(sec) : null;
}
function formatSeconds(total) {
  if (total === null || total === undefined || isNaN(total)) return "—";
  const s = Math.round(total);
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
  return `${m}:${String(sec).padStart(2,"0")}`;
}
function formatPace(timeSec, distance) {
  if (!timeSec || !distance) return "—";
  return `${formatSeconds(timeSec / distance)}/mi`;
}
function isoDate(d) { return d.toISOString().slice(0,10); }
function todayStr() { return isoDate(new Date()); }
function startOfWeek(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const day = d.getDay();
  const diff = (day + 6) % 7;
  d.setDate(d.getDate() - diff);
  return isoDate(d);
}
function weekLabel(mondayStr) {
  const d = new Date(mondayStr + "T00:00:00");
  return d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function computeStreak(runs) {
  if (runs.length === 0) return 0;
  const dateSet = new Set(runs.map(r => r.date));
  let cursor = new Date(todayStr() + "T00:00:00");
  if (!dateSet.has(isoDate(cursor))) {
    cursor = new Date(cursor.getTime() - DAY_MS);
    if (!dateSet.has(isoDate(cursor))) return 0;
  }
  let count = 0;
  while (dateSet.has(isoDate(cursor))) { count++; cursor = new Date(cursor.getTime() - DAY_MS); }
  return count;
}
function esc(str) {
  return String(str ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

// ---------- mutations ----------
function setState(patch) { state = { ...state, ...patch }; render(); }

const PR_MATCH_TOLERANCE = 0.05; // miles

function addRun(run) {
  state.runs = [{ ...run, id: "run-" + Date.now() }, ...state.runs];
  saveLS(LS_RUNS, state.runs);
  applyRunToPRs(run);
  setState({ showAddRun: false, addRunError: "" });
}

// If this run's distance matches a tracked PR distance and beats the
// current best (or there is no best yet), update that PR automatically.
function applyRunToPRs(run) {
  let changed = false;
  state.prs = state.prs.map(pr => {
    const withinTolerance = Math.abs(run.distance - pr.distance) <= PR_MATCH_TOLERANCE;
    if (!withinTolerance) return pr;
    if (pr.timeSec === null || pr.timeSec === undefined || run.timeSec < pr.timeSec) {
      changed = true;
      return { ...pr, timeSec: run.timeSec };
    }
    return pr;
  });
  if (changed) saveLS(LS_PRS, state.prs);
}
function deleteRun(id) {
  state.runs = state.runs.filter(r => r.id !== id);
  saveLS(LS_RUNS, state.runs);
  render();
}
function addPr(pr) {
  state.prs = [...state.prs, { ...pr, id: "pr-" + Date.now() }];
  saveLS(LS_PRS, state.prs);
  setState({ showAddPr: false });
}
function updatePr(id, sec) {
  state.prs = state.prs.map(p => p.id === id ? { ...p, timeSec: sec } : p);
  saveLS(LS_PRS, state.prs);
  setState({ editingPrId: null });
}
function deletePr(id) {
  state.prs = state.prs.filter(p => p.id !== id);
  saveLS(LS_PRS, state.prs);
  render();
}
function setGoal(v) {
  state.goal = v;
  saveLS(LS_GOAL, v);
  setState({ editingGoal: false });
}

function exportData() {
  const payload = { runs: state.runs, prs: state.prs, goal: state.goal, exportedAt: new Date().toISOString() };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `run-log-${todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data.runs)) { state.runs = data.runs; saveLS(LS_RUNS, state.runs); }
      if (Array.isArray(data.prs)) { state.prs = data.prs; saveLS(LS_PRS, state.prs); }
      if (typeof data.goal === "number") { state.goal = data.goal; saveLS(LS_GOAL, state.goal); }
      render();
    } catch {
      alert("That file couldn't be read as a run log export.");
    }
  };
  reader.readAsText(file);
}

// ---------- render ----------
function render() {
  const runs = state.runs;
  const sortedRuns = [...runs].sort((a,b) => a.date < b.date ? 1 : -1);
  const thisWeekStart = startOfWeek(todayStr());
  const thisWeekMiles = runs.filter(r => startOfWeek(r.date) === thisWeekStart).reduce((s,r) => s + r.distance, 0);
  const streak = computeStreak(runs);
  const progressPct = state.goal > 0 ? Math.min(100, (thisWeekMiles / state.goal) * 100) : 0;

  // weekly chart buckets, last 10 weeks
  const buckets = {};
  for (let i = 9; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i * 7);
    const wk = startOfWeek(isoDate(d));
    buckets[wk] = buckets[wk] || 0;
  }
  runs.forEach(r => { const wk = startOfWeek(r.date); if (wk in buckets) buckets[wk] += r.distance; });
  const weeks = Object.entries(buckets).map(([wk, miles]) => ({ label: weekLabel(wk), miles: Math.round(miles*10)/10 }));
  const maxMiles = Math.max(1, ...weeks.map(w => w.miles));

  const app = document.getElementById("app");
  app.innerHTML = `
    <header class="top">
      <div>
        <h1>Run log</h1>
        <p class="sub">Track distance, pace, and personal bests.</p>
      </div>
      <button class="btn btn-primary" onclick="setState({showAddRun:true})">${iconPlus()} Log a run</button>
    </header>

    <section class="card hero">
      <div class="hero-top">
        <div>
          <div class="hero-number">${thisWeekMiles.toFixed(1)} <span class="hero-unit">mi</span></div>
          <div class="hero-label">this week</div>
        </div>
        ${streak > 0 ? `<div class="streak">${iconFlame()} ${streak} day${streak===1?"":"s"} running</div>` : ""}
      </div>
      <div class="lane"><div class="lane-fill" style="width:${progressPct}%"></div></div>
      <div class="lane-caption">
        ${state.editingGoal ? goalEditorHTML() : `<button class="link" onclick="setState({editingGoal:true})">goal: ${state.goal} mi/week ${iconPencil()}</button>`}
      </div>
    </section>

    <section class="block">
      <div class="section-head">
        <h2>Personal bests</h2>
        <button class="link" onclick="setState({showAddPr:true})">${iconPlus(13)} add distance</button>
      </div>
      <div class="pr-grid">
        ${state.prs.map(prCardHTML).join("")}
      </div>
      ${state.showAddPr ? addPrFormHTML() : ""}
    </section>

    <section class="block">
      <h2>Mileage, last 10 weeks</h2>
      <div class="chart-wrap">
        <div class="chart">
          ${weeks.map(w => `
            <div class="chart-col">
              <div class="chart-bar" style="height:${Math.max(2, (w.miles / maxMiles) * 100)}%" title="${w.miles} mi"></div>
              <div class="chart-tick">${w.label}</div>
            </div>
          `).join("")}
        </div>
      </div>
    </section>

    <section class="block">
      <h2>Recent runs</h2>
      ${sortedRuns.length === 0 ? `<div class="empty">No runs logged yet. Add your first one above.</div>` : `
        <div class="run-list">
          ${sortedRuns.map(runRowHTML).join("")}
        </div>
      `}
    </section>

    <div class="footer-row">
      <button class="link" onclick="exportData()">${iconDownload()} export data</button>
      <button class="link" onclick="document.getElementById('import-input').click()">${iconUpload()} import data</button>
      <input type="file" id="import-input" accept="application/json" style="display:none" onchange="importData(this.files[0])" />
    </div>

    ${state.showAddRun ? addRunModalHTML() : ""}
  `;
}

function goalEditorHTML() {
  return `
    <span style="display:inline-flex;align-items:center;gap:6px;color:var(--text-dim);font-size:12.5px;">
      goal:
      <input type="number" min="0" step="0.5" id="goal-input" value="${state.goal}"
        class="text-input" style="width:60px;min-height:30px;padding:4px 6px;font-size:12.5px;" />
      mi/week
      <button class="btn-icon" onclick="setGoal(Number(document.getElementById('goal-input').value)||0)">${iconCheck()}</button>
      <button class="btn-icon" onclick="setState({editingGoal:false})">${iconX()}</button>
    </span>
  `;
}

function prCardHTML(pr) {
  if (state.editingPrId === pr.id) {
    return `
      <div class="pr-card">
        <button class="btn-icon pr-delete" onclick="deletePr('${pr.id}')">${iconX(12)}</button>
        <div class="pr-label">${esc(pr.label)}</div>
        <input class="text-input" id="pr-input-${pr.id}" placeholder="mm:ss"
          value="${pr.timeSec ? formatSeconds(pr.timeSec) : ""}"
          style="width:100%;font-size:15px;padding:6px 8px;min-height:34px;margin-bottom:6px;" />
        <div style="display:flex;gap:4px;">
          <button class="btn-icon" onclick="const v=document.getElementById('pr-input-${pr.id}').value; const s=parseTimeToSeconds(v); if(s) updatePr('${pr.id}', s);">${iconCheck()}</button>
          <button class="btn-icon" onclick="setState({editingPrId:null})">${iconX()}</button>
        </div>
      </div>
    `;
  }
  return `
    <div class="pr-card">
      <button class="btn-icon pr-delete" onclick="deletePr('${pr.id}')">${iconX(12)}</button>
      <div class="pr-label">${esc(pr.label)}</div>
      <button class="pr-time" onclick="setState({editingPrId:'${pr.id}'})">${formatSeconds(pr.timeSec)}</button>
      <div class="pr-pace">${pr.timeSec ? "pace " + formatPace(pr.timeSec, pr.distance) : "tap to set"}</div>
    </div>
  `;
}

function addPrFormHTML() {
  return `
    <div class="inline-form">
      <input class="text-input" id="new-pr-label" placeholder="Distance name (e.g. 10K)" />
      <input class="text-input" id="new-pr-distance" type="number" step="0.01" placeholder="Miles" style="flex:none;width:90px;" />
      <input class="text-input" id="new-pr-time" placeholder="mm:ss (optional)" style="flex:none;width:110px;" />
      <button class="btn btn-primary btn-sm" onclick="submitNewPr()">Add</button>
      <button class="btn btn-ghost btn-sm" onclick="setState({showAddPr:false})">Cancel</button>
    </div>
  `;
}
function submitNewPr() {
  const label = document.getElementById("new-pr-label").value.trim();
  const distance = Number(document.getElementById("new-pr-distance").value);
  const time = document.getElementById("new-pr-time").value;
  if (!label || !distance || distance <= 0) return;
  addPr({ label, distance, timeSec: parseTimeToSeconds(time) });
}

function runRowHTML(r) {
  const d = new Date(r.date + "T00:00:00");
  const dateLabel = d.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  return `
    <div class="run-row">
      <div class="run-date">${dateLabel}</div>
      <div class="run-main">
        <div class="run-dist">${r.distance} mi</div>
        ${r.notes ? `<div class="run-notes">${esc(r.notes)}</div>` : ""}
      </div>
      <div class="run-time">${formatSeconds(r.timeSec)}</div>
      <div class="run-pace">${formatPace(r.timeSec, r.distance)}</div>
      <button class="btn-icon" onclick="deleteRun('${r.id}')">${iconTrash()}</button>
    </div>
  `;
}

function addRunModalHTML() {
  return `
    <div class="overlay" onclick="if(event.target===this) setState({showAddRun:false, addRunError:''})">
      <div class="modal">
        <div class="modal-head">
          <h3>Log a run</h3>
          <button class="btn-icon" onclick="setState({showAddRun:false, addRunError:''})">${iconX()}</button>
        </div>
        <label class="field">
          <span>Date</span>
          <input type="date" id="run-date" class="text-input" value="${todayStr()}" />
        </label>
        <div class="field-row">
          <label class="field">
            <span>Distance (mi)</span>
            <input type="number" step="0.01" id="run-distance" class="text-input" placeholder="3.1" />
          </label>
          <label class="field">
            <span>Time</span>
            <input id="run-time" class="text-input" placeholder="mm:ss" />
          </label>
        </div>
        <label class="field">
          <span>Notes (optional)</span>
          <input id="run-notes" class="text-input" placeholder="Easy shakeout, felt good" />
        </label>
        ${state.addRunError ? `<div class="error">${esc(state.addRunError)}</div>` : ""}
        <div class="modal-actions">
          <button class="btn btn-ghost" onclick="setState({showAddRun:false, addRunError:''})">Cancel</button>
          <button class="btn btn-primary" onclick="submitNewRun()">Save run</button>
        </div>
      </div>
    </div>
  `;
}
function submitNewRun() {
  const date = document.getElementById("run-date").value;
  const distance = Number(document.getElementById("run-distance").value);
  const timeStr = document.getElementById("run-time").value;
  const notes = document.getElementById("run-notes").value.trim();
  const sec = parseTimeToSeconds(timeStr);
  if (!date) return setState({ addRunError: "Add a date." });
  if (!distance || distance <= 0) return setState({ addRunError: "Add a distance greater than 0." });
  if (!sec) return setState({ addRunError: "Add a time as mm:ss." });
  addRun({ date, distance, timeSec: sec, notes });
}
