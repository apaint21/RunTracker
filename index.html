<body>
<div id="app"></div>

<script>
const DEFAULT_PRS=[
  {id:"pr-mile",label:"Mile",distance:1,timeSec:null},
  {id:"pr-15",label:"1.5 mi",distance:1.5,timeSec:null},
  {id:"pr-2",label:"2 mi",distance:2,timeSec:null},
  {id:"pr-5k",label:"5K",distance:3.10686,timeSec:null}
];

const DAY_MS=86400000;
const LS_RUNS="runtracker_runs";
const LS_PRS="runtracker_prs";
const LS_GOAL="runtracker_goal";

let state={
  runs:loadLS(LS_RUNS,[]),
  prs:loadLS(LS_PRS,DEFAULT_PRS),
  goal:loadLS(LS_GOAL,20),
  page:"home",
  chartRange:"10w",
  showAddRun:false,
  showAddPr:false,
  editingGoal:false,
  editingPrId:null,
  editingRunId:null,
  addRunError:""
};

function loadLS(key,fallback){
  try{
    const raw=localStorage.getItem(key);
    return raw?JSON.parse(raw):fallback;
  }catch{
    return fallback;
  }
}

function saveLS(key,val){
  try{
    localStorage.setItem(key,JSON.stringify(val));
  }catch(e){
    console.error("save failed",key,e);
  }
}

function parseTimeToSeconds(str){
  if(!str)return null;

  const parts=str.trim().split(":").map(p=>p.trim());

  if(parts.some(p=>p===""||isNaN(Number(p))))return null;

  let sec=0;

  if(parts.length===3){
    sec=(+parts[0])*3600+(+parts[1])*60+(+parts[2]);
  }else if(parts.length===2){
    sec=(+parts[0])*60+(+parts[1]);
  }else if(parts.length===1){
    sec=+parts[0];
  }else{
    return null;
  }

  return sec>0?Math.round(sec):null;
}

function formatSeconds(total){
  if(total===null||total===undefined||isNaN(total))return "—";

  const s=Math.round(total);
  const h=Math.floor(s/3600);
  const m=Math.floor((s%3600)/60);
  const sec=s%60;

  if(h>0)return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

  return `${m}:${String(sec).padStart(2,"0")}`;
}

function formatPace(timeSec,distance){
  if(!timeSec||!distance)return "—";
  return `${formatSeconds(timeSec/distance)}/mi`;
}

function isoDate(d){
  return d.toISOString().slice(0,10);
}

function todayStr(){
  return isoDate(new Date());
}

function startOfWeek(dateStr){
  const d=new Date(dateStr+"T00:00:00");
  const day=d.getDay();
  const diff=(day+6)%7;
  d.setDate(d.getDate()-diff);
  return isoDate(d);
}

function weekLabel(mondayStr){
  const d=new Date(mondayStr+"T00:00:00");
  return d.toLocaleDateString(undefined,{month:"short",day:"numeric"});
}

function computeStreak(runs){
  if(runs.length===0)return 0;

  const dateSet=new Set(runs.map(r=>r.date));
  let cursor=new Date(todayStr()+"T00:00:00");

  if(!dateSet.has(isoDate(cursor))){
    cursor=new Date(cursor.getTime()-DAY_MS);
    if(!dateSet.has(isoDate(cursor)))return 0;
  }

  let count=0;

  while(dateSet.has(isoDate(cursor))){
    count++;
    cursor=new Date(cursor.getTime()-DAY_MS);
  }

  return count;
}

function esc(str){
  return String(str??"").replace(/[&<>"']/g,c=>({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  }[c]));
}

function setState(patch){
  state={...state,...patch};
  render();
}

function addRun(run){
  state.runs=[{...run,id:"run-"+Date.now()},...state.runs];
  saveLS(LS_RUNS,state.runs);
  setState({
    showAddRun:false,
    editingRunId:null,
    addRunError:""
  });
}

function updateRun(id,run){
  state.runs=state.runs.map(r=>r.id===id?{...r,...run}:r);
  saveLS(LS_RUNS,state.runs);
  setState({
    showAddRun:false,
    editingRunId:null,
    addRunError:""
  });
}

function deleteRun(id){
  state.runs=state.runs.filter(r=>r.id!==id);
  saveLS(LS_RUNS,state.runs);
  render();
}

function addPr(pr){
  state.prs=[...state.prs,{...pr,id:"pr-"+Date.now()}];
  saveLS(LS_PRS,state.prs);
  setState({showAddPr:false});
}

function updatePr(id,sec){
  state.prs=state.prs.map(p=>p.id===id?{...p,timeSec:sec}:p);
  saveLS(LS_PRS,state.prs);
  setState({editingPrId:null});
}

function deletePr(id){
  state.prs=state.prs.filter(p=>p.id!==id);
  saveLS(LS_PRS,state.prs);
  render();
}

function setGoal(v){
  state.goal=v;
  saveLS(LS_GOAL,v);
  setState({editingGoal:false});
}

function exportData(){
  const payload={
    runs:state.runs,
    prs:state.prs,
    goal:state.goal,
    exportedAt:new Date().toISOString()
  };

  const blob=new Blob(
    [JSON.stringify(payload,null,2)],
    {type:"application/json"}
  );

  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");

  a.href=url;
  a.download=`run-log-${todayStr()}.json`;
  a.click();

  URL.revokeObjectURL(url);
}

function importData(file){
  if(!file)return;

  const reader=new FileReader();

  reader.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);

      if(!data||typeof data!=="object"){
        throw new Error("Invalid file");
      }

      if(Array.isArray(data.runs)){
        state.runs=data.runs.map((r,i)=>({
          ...r,
          id:r.id||`run-${Date.now()}-${i}`
        }));

        saveLS(LS_RUNS,state.runs);
      }

      if(Array.isArray(data.prs)){
        state.prs=data.prs.map((p,i)=>({
          id:p.id||`pr-${Date.now()}-${i}`,
          label:String(p.label??""),
          distance:Number(p.distance)||0,
          timeSec:
            p.timeSec===null||
            p.timeSec===undefined||
            p.timeSec===""
              ?null
              :Number(p.timeSec)
        })).filter(p=>p.label&&p.distance>0);

        saveLS(LS_PRS,state.prs);
      }

      if(typeof data.goal==="number"){
        state.goal=data.goal;
        saveLS(LS_GOAL,state.goal);
      }

      render();
    }catch{
      alert("That file couldn't be read as a run log export.");
    }
  };

  reader.readAsText(file);
}

function render(){
  const app=document.getElementById("app");

  if(state.page==="home"){
    app.innerHTML=homeHTML();
  }else if(state.page==="history"){
    app.innerHTML=historyHTML();
  }else{
    app.innerHTML=prsHTML();
  }

  app.innerHTML+=bottomNavHTML();

  if(state.showAddRun||state.editingRunId){
    app.innerHTML+=runModalHTML();
  }
}

function homeHTML(){
  const runs=state.runs;
  const thisWeekStart=startOfWeek(todayStr());

  const thisWeekMiles=runs
    .filter(r=>startOfWeek(r.date)===thisWeekStart)
    .reduce((s,r)=>s+Number(r.distance||0),0);

  const streak=computeStreak(runs);

  const progressPct=state.goal>0
    ?Math.min(100,(thisWeekMiles/state.goal)*100)
    :0;

  return `
    <header class="top">
      <div>
        <h1>Run log</h1>
        <p class="sub">Track distance, pace, and personal bests.</p>
      </div>

      <button class="btn btn-primary" onclick="setState({showAddRun:true})">
        ${iconPlus()} Log a run
      </button>
    </header>

    ${calendarHTML()}

    <section class="card hero">
      <div class="hero-top">
        <div>
          <div class="hero-number">
            ${thisWeekMiles.toFixed(1)} <span class="hero-unit">mi</span>
          </div>

          <div class="hero-label">this week</div>
        </div>

        ${streak>0
          ?`<div class="streak">
              ${iconFlame()} ${streak} day${streak===1?"":"s"} running
            </div>`
          :""
        }
      </div>

      <div class="lane">
        <div class="lane-fill" style="width:${progressPct}%"></div>
      </div>

      <div class="lane-caption">
        ${
          state.editingGoal
            ?goalEditorHTML()
            :`<button class="link" onclick="setState({editingGoal:true})">
                goal: ${state.goal} mi/week ${iconPencil()}
              </button>`
        }
      </div>
    </section>
  `;
}

function calendarHTML(){
  const now=new Date();
  const year=now.getFullYear();
  const month=now.getMonth();

  const monthName=now.toLocaleDateString(undefined,{
    month:"long",
    year:"numeric"
  });

  const firstDay=new Date(year,month,1);
  const daysInMonth=new Date(year,month+1,0).getDate();

  const mondayOffset=(firstDay.getDay()+6)%7;
  const dateSet=new Set(state.runs.map(r=>r.date));

  let cells="";

  for(let i=0;i<mondayOffset;i++){
    cells+=`<div class="calendar-day empty-day"></div>`;
  }

  for(let day=1;day<=daysInMonth;day++){
    const date=
      `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

    const hasRun=dateSet.has(date);
    const today=date===todayStr();

    cells+=`
      <div class="calendar-day ${hasRun?"has-run":""} ${today?"today":""}">
        ${day}
        ${
          hasRun
            ?`<span class="calendar-check">${iconCheck(13)}</span>`
            :""
        }
      </div>
    `;
  }

  return `
    <section class="block">
      <div class="calendar">
        <div class="calendar-head">
          <div class="calendar-title">${monthName}</div>
        </div>

        <div class="calendar-weekdays">
          <div class="calendar-weekday">M</div>
          <div class="calendar-weekday">T</div>
          <div class="calendar-weekday">W</div>
          <div class="calendar-weekday">T</div>
          <div class="calendar-weekday">F</div>
          <div class="calendar-weekday">S</div>
          <div class="calendar-weekday">S</div>
        </div>

        <div class="calendar-grid">
          ${cells}
        </div>
      </div>
    </section>
  `;
}

function historyHTML(){
  const runs=state.runs;
  const sortedRuns=[...runs].sort((a,b)=>a.date<b.date?1:-1);

  const chart=buildChartData(state.chartRange);

  return `
    <header class="top">
      <div>
        <h1>History</h1>
        <p class="sub">Mileage and logged runs.</p>
      </div>

      <button class="btn btn-primary" onclick="setState({showAddRun:true})">
        ${iconPlus()} Log a run
      </button>
    </header>

    <section class="block">
      <h2>Mileage</h2>

      <div class="chart-wrap">
        <div class="chart-controls">
          <button
            class="chart-option ${state.chartRange==="10w"?"active":""}"
            onclick="setState({chartRange:'10w'})">
            10 weeks

function buildChartData(range){
  const buckets={};

  if(range==="10w"){
    for(let i=9;i>=0;i--){
      const d=new Date();
      d.setDate(d.getDate()-i*7);

      const wk=startOfWeek(isoDate(d));
      buckets[wk]=buckets[wk]||0;
    }

    state.runs.forEach(r=>{
      const wk=startOfWeek(r.date);

      if(wk in buckets){
        buckets[wk]+=Number(r.distance||0);
      }
    });

    const weeks=Object.entries(buckets).map(([wk,miles])=>({
      label:weekLabel(wk),
      miles:Math.round(miles*10)/10
    }));

    return {
      data:weeks,
      maxMiles:Math.max(1,...weeks.map(w=>w.miles))
    };
  }

  if(range==="3m"){
    const now=new Date();

    for(let i=2;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,1);
      const key=
        `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

      buckets[key]=0;
    }

    state.runs.forEach(r=>{
      const key=r.date.slice(0,7);

      if(key in buckets){
        buckets[key]+=Number(r.distance||0);
      }
    });

    const months=Object.entries(buckets).map(([key,miles])=>{
      const d=new Date(key+"-01T00:00:00");

      return {
        label:d.toLocaleDateString(undefined,{month:"short"}),
        miles:Math.round(miles*10)/10
      };
    });

    return {
      data:months,
      maxMiles:Math.max(1,...months.map(w=>w.miles))
    };
  }

  const now=new Date();

  for(let i=11;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);

    const key=
      `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;

    buckets[key]=0;
  }

  state.runs.forEach(r=>{
    const key=r.date.slice(0,7);

    if(key in buckets){
      buckets[key]+=Number(r.distance||0);
    }
  });

  const months=Object.entries(buckets).map(([key,miles])=>{
    const d=new Date(key+"-01T00:00:00");

    return {
      label:d.toLocaleDateString(undefined,{month:"short"}),
      miles:Math.round(miles*10)/10
    };
  });

  return {
    data:months,
    maxMiles:Math.max(1,...months.map(w=>w.miles))
  };
}

function runModalHTML(){
  const editing=!!state.editingRunId;

  const run=editing
    ?state.runs.find(r=>r.id===state.editingRunId)

  if(editing&&!run){
    state.editingRunId=null;
    return "";
  }

  return `
    <div
      class="overlay"
      onclick="
        if(event.target===this)
          setState({
            showAddRun:false,
            editingRunId:null,
            addRunError:''
          })
      ">

      <div class="modal">
        <div class="modal-head">
          <h3>${editing?"Edit run":"Log a run"}</h3>

          <button
            class="btn-icon"
            onclick="
              setState({
                showAddRun:false,
                editingRunId:null,
                addRunError:''
              })
            ">
            ${iconX()}
          </button>
        </div>

        <label class="field">
          <span>Date</span>

          <input
            type="date"
            id="run-date"
            class="text-input"
            value="${run?esc(run.date):todayStr()}"
          />
        </label>

        <div class="field-row">
          <label class="field">
            <span>Distance (mi)</span>

            <input
              type="number"
              step="0.01"
              id="run-distance"
              class="text-input"
              placeholder="3.1"
              value="${run?esc(run.distance):""}"
            />
          </label>

          <label class="field">
            <span>Time</span>

            <input
              id="run-time"
              class="text-input"
              placeholder="mm:ss"
              value="${run?formatSeconds(run.timeSec):""}"
            />
          </label>
        </div>

        <label class="field">
          <span>Notes (optional)</span>

          <input
            id="run-notes"
            class="text-input"
            placeholder="Easy shakeout, felt good"
            value="${run?esc(run.notes||""):""}"
          />
        </label>

        ${
          state.addRunError
            ?`<div class="error">${esc(state.addRunError)}</div>`
            :""
        }

        <div class="modal-actions">
          <button
            class="btn btn-ghost"
            onclick="
              setState({
                showAddRun:false,
                editingRunId:null,
                addRunError:''
              })
            ">
            Cancel
          </button>

          <button
            class="btn btn-primary"
            onclick="${editing?"submitEditRun()":"submitNewRun()"}">
            ${editing?"Save changes":"Save run"}
          </button>
        </div>
      </div>
    </div>
  `;
}

function submitNewRun(){
  const date=document.getElementById("run-date").value;
  const distance=Number(document.getElementById("run-distance").value);
  const timeStr=document.getElementById("run-time").value;
  const notes=document.getElementById("run-notes").value.trim();
  const sec=parseTimeToSeconds(timeStr);

  if(!date)return setState({addRunError:"Add a date."});

  if(!distance||distance<=0){
    return setState({
      addRunError:"Add a distance greater than 0."
    });
  }

  if(!sec){
    return setState({
      addRunError:"Add a time as mm:ss."
    });
  }

  addRun({
    date,
    distance,
    timeSec:sec,
    notes
  });
}

function submitEditRun(){
  const id=state.editingRunId;
  const date=document.getElementById("run-date").value;
  const distance=Number(document.getElementById("run-distance").value);
  const timeStr=document.getElementById("run-time").value;
  const notes=document.getElementById("run-notes").value.trim();
  const sec=parseTimeToSeconds(timeStr);

  if(!date)return setState({addRunError:"Add a date."});

  if(!distance||distance<=0){
    return setState({
      addRunError:"Add a distance greater than 0."
    });
  }

  if(!sec){
    return setState({
      addRunError:"Add a time as mm:ss."
    });
  }

  updateRun(id,{
    date,
    distance,
    timeSec:sec,
    notes
  });
}
