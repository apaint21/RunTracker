<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#11130f;--card:#191c16;--line:#30342b;--text:#f2f3ed;--muted:#92988b;--accent:#c7f36b;--danger:#ff7777}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app{width:min(100%,480px);min-height:100vh;margin:auto;padding:20px 16px 90px}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0}
h1{font-size:28px}h2{font-size:20px;margin-bottom:14px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.sub{color:var(--muted);font-size:13px}
.hero,.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.hero{padding:20px;margin-bottom:12px}
.hero-label{color:var(--muted);font-size:13px}
.hero-value{font:700 42px "Space Grotesk";margin:4px 0}
.hero-value span{font-size:18px;color:var(--muted)}
.progress{height:7px;background:#292d24;border-radius:9px;overflow:hidden;margin:14px 0 8px}
.progress i{display:block;height:100%;background:var(--accent);width:0}
.row{display:flex;justify-content:space-between;align-items:center}
.card{padding:16px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat strong{display:block;font:600 25px "Space Grotesk";margin-top:3px}
.label{font-size:12px;color:var(--muted)}
.section{margin-top:24px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal-head{font-size:10px;color:var(--muted);text-align:center;padding-bottom:4px}
.day{height:38px;border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--muted)}
.day.run{color:var(--bg);background:var(--accent);border-color:var(--accent);font-weight:600}
.day.today{outline:1px solid var(--accent);outline-offset:1px}
.chart{height:180px;display:flex;align-items:end;gap:7px;padding:20px 4px 4px}
.bar-wrap{flex:1;height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:5px}
.bar{width:100%;max-width:28px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.bar-label{font-size:9px;color:var(--muted)}
.run-list{display:flex;flex-direction:column;gap:8px}
.run{display:grid;grid-template-columns:42px minmax(0,1fr) auto auto 28px 28px;gap:8px;align-items:center;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.run-date{font-size:12px;color:var(--muted)}
.run-main{min-width:0}.run-distance{font-weight:600}.run-note{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run-meta{font-size:11px;color:var(--muted);white-space:nowrap}
.icon{border:0;background:none;color:var(--muted);padding:4px;font-size:16px}.icon:hover{color:var(--text)}
.pr{display:flex;justify-content:space-between;align-items:center}
.pr-info strong{display:block;font:600 18px "Space Grotesk"}.pr-info span{color:var(--muted);font-size:12px}
.actions{display:flex;gap:8px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:10px;padding:9px 13px}
.btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:600}
.empty{text-align:center;color:var(--muted);padding:25px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,480px);height:68px;background:#171a14ee;backdrop-filter:blur(12px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(3,1fr);z-index:5}
.nav button{border:0;background:none;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px}.nav button.active{color:var(--accent)}.nav svg{width:21px;height:21px}
.tab{display:none}.tab.active{display:block}
.modal{position:fixed;inset:0;background:#000b;display:none;align-items:end;justify-content:center;z-index:10}.modal.show{display:flex}
.sheet{width:min(100%,480px);background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:20px 16px 25px}
.form{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;background:#11130f;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.modal-actions{display:flex;gap:8px;margin-top:6px}.modal-actions>*{flex:1}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:9px 13px;border-radius:9px;font-size:12px;display:none;z-index:20}
@media(max-width:390px){.run{grid-template-columns:38px minmax(0,1fr) auto 28px 28px}.run-meta.pace{display:none}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div><h1>Run Log</h1><div class="sub" id="today"></div></div><button class="btn primary" onclick="openRun()">+ Run</button></header>

<section id="home" class="tab active">
<div class="hero"><div class="hero-label">Weekly mileage</div><div class="hero-value"><span id="weekMiles">0.0</span> <span>/ <b id="goalText">20</b> mi</span></div><div class="progress"><i id="progress"></i></div><div class="row sub"><span>Goal progress</span><span id="goalPct">0%</span></div></div>
<div class="stats"><div class="card"><div class="label">STREAK</div><div class="stat"><strong id="streak">0</strong><span class="label">days</span></div></div><div class="card"><div class="label">TOTAL RUNS</div><div class="stat"><strong id="totalRuns">0</strong><span class="label">runs</span></div></div></div>
<div class="section"><h2>Calendar</h2><div class="card"><div class="row" style="margin-bottom:12px"><button class="icon" onclick="changeMonth(-1)">‹</button><strong id="month"></strong><button class="icon" onclick="changeMonth(1)">›</button></div><div class="calendar" id="calendar"></div></div></div>
</section>

<section id="history" class="tab">
<div class="section"><div class="row"><h2>Mileage</h2><span class="sub">Last 10 weeks</span></div><div class="card"><div class="chart" id="chart"></div></div></div>
<div class="section"><div class="row"><h2>Runs</h2><button class="btn" onclick="exportData()">Export</button></div><div class="run-list" id="runs"></div></div>
<div class="section"><div class="card"><div class="row"><span class="label">IMPORT DATA</span><button class="btn" onclick="document.getElementById('file').click()">Import JSON</button></div><input id="file" type="file" accept=".json,application/json" hidden onchange="importData(this)"></div></div>
</section>

<section id="prs" class="tab">
<div class="section"><div class="row"><h2>Personal Bests</h2><button class="btn primary" onclick="openPR()">+ PR</button></div><div id="prList"></div></div>
</section>
</div>

<nav class="nav">
<button class="active" onclick="tab('home',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v10h14V10M9 20v-6h6v6"/></svg>Home</button>
<button onclick="tab('history',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19V5M4 19h17"/><path d="M7 16l4-5 3 2 5-7"/></svg>History</button>
<button onclick="tab('prs',this)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3 2.8 5.7L21 9.6l-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9L12 3z"/></svg>PRs</button>
</nav>

<div class="modal" id="runModal"><div class="sheet"><div class="row" style="margin-bottom:18px"><h2 id="runTitle">Add Run</h2><button class="icon" onclick="closeModal('runModal')">×</button></div><div class="form">
<div class="field"><label>DATE</label><input id="rDate" type="date"></div>
<div class="field"><label>DISTANCE (MILES)</label><input id="rDist" type="number" step="0.01" min="0"></div>
<div class="field"><label>TIME (HH:MM:SS)</label><input id="rTime" placeholder="00:30:00"></div>
<div class="field"><label>NOTE</label><input id="rNote" maxlength="100"></div>
<div class="modal-actions"><button class="btn" onclick="closeModal('runModal')">Cancel</button><button class="btn primary" onclick="saveRun()">Save</button></div>
</div></div></div>

<div class="modal" id="prModal"><div class="sheet"><div class="row" style="margin-bottom:18px"><h2 id="prTitle">Add PR</h2><button class="icon" onclick="closeModal('prModal')">×</button></div><div class="form">
<div class="field"><label>DISTANCE</label><input id="pDist" placeholder="5K"></div>
<div class="field"><label>TIME (HH:MM:SS)</label><input id="pTime" placeholder="00:25:00"></div>
<div class="modal-actions"><button class="btn" onclick="closeModal('prModal')">Cancel</button><button class="btn primary" onclick="savePR()">Save</button></div>
</div></div></div>
<div class="toast" id="toast"></div>

<script>
const KEY="runLogData";
let data=JSON.parse(localStorage.getItem(KEY)||'{"runs":[],"prs":[],"goal":20}');
let editRun=null,editPR=null,monthDate=new Date();

function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function id(){return Date.now()+Math.random().toString(16).slice(2)}
function pad(n){return String(n).padStart(2,"0")}
function parseTime(v){if(typeof v==="number")return v;let a=String(v||"").split(":").map(Number);if(a.some(isNaN))return 0;if(a.length===3)return a[0]*3600+a[1]*60+a[2];if(a.length===2)return a[0]*60+a[1];return 0}
function time(s){s=Math.max(0,Math.round(s||0));return pad(Math.floor(s/3600))+":"+pad(Math.floor(s%3600/60))+":"+pad(s%60)}
function pace(r){return r.distance&&r.timeSec?time(r.timeSec/r.distance):"--:--"}
function date(d){return new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})}
function localDate(){let d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function toast(t){let e=document.getElementById("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
function tab(name,btn){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));document.getElementById(name).classList.add("active");document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));btn.classList.add("active")}
function openRun(r=null){editRun=r?.id||null;document.getElementById("runTitle").textContent=r?"Edit Run":"Add Run";rDate.value=r?.date||localDate();rDist.value=r?.distance||"";rTime.value=r?time(r.timeSec):"";rNote.value=r?.note||"";document.getElementById("runModal").classList.add("show")}
function saveRun(){let distance=parseFloat(rDist.value),ts=parseTime(rTime.value);if(!rDate.value||!distance)return toast("Enter date and distance");let r={id:editRun||id(),date:rDate.value,distance,timeSec:ts,note:rNote.value.trim()};if(editRun)data.runs=data.runs.map(x=>x.id===editRun?r:x);else data.runs.push(r);data.runs.sort((a,b)=>b.date.localeCompare(a.date));closeModal("runModal");save();toast(editRun?"Run updated":"Run added")}
function delRun(id){if(!confirm("Delete this run?"))return;data.runs=data.runs.filter(r=>r.id!==id);save()}
function openPR(p=null){editPR=p?.id||null;document.getElementById("prTitle").textContent=p?"Edit PR":"Add PR";pDist.value=p?.distance||"";pTime.value=p?time(p.timeSec):"";document.getElementById("prModal").classList.add("show")}
function savePR(){if(!pDist.value||!pTime.value)return toast("Enter distance and time");let p={id:editPR||id(),distance:pDist.value.trim(),timeSec:parseTime(pTime.value)};if(editPR)data.prs=data.prs.map(x=>x.id===editPR?p:x);else data.prs.push(p);closeModal("prModal");save();toast(editPR?"PR updated":"PR added")}
function delPR(id){if(!confirm("Delete this PR?"))return;data.prs=data.prs.filter(p=>p.id!==id);save()}
function closeModal(id){document.getElementById(id).classList.remove("show")}
function renderHome(){let now=new Date(),start=new Date(now);start.setDate(now.getDate()-now.getDay()+1);let miles=data.runs.filter(r=>new Date(r.date+"T12:00:00")>=start).reduce((s,r)=>s+r.distance,0),pct=Math.min(100,miles/data.goal*100);weekMiles.textContent=miles.toFixed(1);goalText.textContent=data.goal;goalPct.textContent=Math.round(pct)+"%";progress.style.width=pct+"%";totalRuns.textContent=data.runs.length;streak.textContent=getStreak();renderCalendar()}
function getStreak(){let days=new Set(data.runs.map(r=>r.date)),n=0,d=new Date();while(days.has(localDateFrom(d))){n++;d.setDate(d.getDate()-1)}return n}
function localDateFrom(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function renderCalendar(){let y=monthDate.getFullYear(),m=monthDate.getMonth(),first=new Date(y,m,1),last=new Date(y,m+1,0),runs=new Set(data.runs.map(r=>r.date));month.textContent=first.toLocaleDateString(undefined,{month:"long",year:"numeric"});calendar.innerHTML=["M","T","W","T","F","S","S"].map(x=>`<div class="cal-head">${x}</div>`).join("");let offset=(first.getDay()+6)%7;for(let i=0;i<offset;i++)calendar.innerHTML+=`<div></div>`;for(let d=1;d<=last.getDate();d++){let ds=y+"-"+pad(m+1)+"-"+pad(d);calendar.innerHTML+=`<div class="day ${runs.has(ds)?"run":""} ${ds===localDate()?"today":""}">${runs.has(ds)?"✓":d}</div>`}}
function changeMonth(n){monthDate.setMonth(monthDate.getMonth()+n);renderCalendar()}
function renderHistory(){let weeks=[];let now=new Date();for(let i=9;i>=0;i--){let end=new Date(now);end.setDate(now.getDate()-now.getDay()-7*i+6);let start=new Date(end);start.setDate(end.getDate()-6);let miles=data.runs.filter(r=>{let d=new Date(r.date+"T12:00:00");return d>=start&&d<=end}).reduce((s,r)=>s+r.distance,0);weeks.push({miles,start})}let max=Math.max(1,...weeks.map(x=>x.miles));chart.innerHTML=weeks.map(x=>`<div class="bar-wrap"><div class="bar" style="height:${x.miles/max*100}%"></div><div class="bar-label">${x.miles.toFixed(0)}</div></div>`).join("");runs.innerHTML=data.runs.length?data.runs.map(r=>`<div class="run"><div class="run-date">${date(r.date)}</div><div class="run-main"><div class="run-distance">${r.distance} mi</div>${r.note?`<div class="run-note">${escapeHTML(r.note)}</div>`:""}</div><div class="run-meta">${time(r.timeSec)}</div><div class="run-meta pace">${pace(r)}/mi</div><button class="icon" onclick='openRun(${JSON.stringify(r)})'>✎</button><button class="icon" onclick="delRun('${r.id}')">×</button></div>`).join(""):`<div class="empty">No runs logged yet.</div>`}
function renderPRs(){prList.innerHTML=data.prs.length?data.prs.map(p=>`<div class="card pr"><div class="pr-info"><strong>${escapeHTML(p.distance)}</strong><span>${time(p.timeSec)}</span></div><div class="actions"><button class="icon" onclick='openPR(${JSON.stringify(p)})'>✎</button><button class="icon" onclick="delPR('${p.id}')">×</button></div></div>`).join(""):`<div class="card empty">No personal bests yet.</div>`}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
function normalizeRun(r){return{id:r.id||id(),date:r.date||r.runDate||localDate(),distance:Number(r.distance??r.miles??0),timeSec:parseTime(r.timeSec??r.timeSeconds??r.seconds??r.time),note:r.note||r.notes||""}}
function normalizePR(p){return{id:p.id||id(),distance:String(p.distance??p.name??p.label??""),timeSec:parseTime(p.timeSec??p.timeSeconds??p.seconds??p.time)}}
function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result),runs=x.runs,prs=x.prs||x.personalBests||x.personal_records;if(Array.isArray(x)){runs=x.filter(v=>v.date||v.runDate);prs=x.filter(v=>v.distance&&(v.time||v.timeSec||v.timeSeconds||v.seconds)&&!v.date)}if(!Array.isArray(runs)&&!Array.isArray(prs))throw 0;if(Array.isArray(runs))data.runs=runs.map(normalizeRun).filter(r=>r.distance>0);if(Array.isArray(prs))data.prs=prs.map(normalizePR).filter(p=>p.distance&&p.timeSec>0);if(x.goal||x.weeklyGoal)data.goal=Number(x.goal||x.weeklyGoal);save();toast("Data imported")}catch(e){toast("Invalid JSON")}input.value=""}}
function exportData(){let blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="run-log.json";a.click();URL.revokeObjectURL(a.href)}
function render(){today.textContent=new Date().toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric",year:"numeric"});renderHome();renderHistory();renderPRs()}
render();
</script>

</body>
</html>
