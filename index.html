<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Run Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E0F0C;--surface:#17190F;--border:#2A2E1E;--text:#ECEEE4;--dim:#8C9080;--accent:#B6FF3B;--adim:rgba(182,255,59,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:"IBM Plex Sans",sans-serif}button,input{font:inherit}button{color:inherit}.app{width:100%;max-width:480px;min-height:100vh;margin:auto;padding:20px 16px 90px}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0}h1{font-size:24px}.sub{color:var(--dim);font-size:12px;margin:4px 0 0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:9px 12px;cursor:pointer}.btn-primary{background:var(--accent);color:#10120C;border-color:var(--accent);font-weight:600}.btn-icon{border:0;background:none;color:var(--text);cursor:pointer;padding:5px;line-height:1}
.block{margin-bottom:14px}.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:14px}.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.hero-number{font-family:"Space Grotesk",sans-serif;font-size:34px;font-weight:700;line-height:1}.hero-unit{font-size:14px;color:var(--dim)}.hero-label{color:var(--dim);font-size:12px;margin-top:5px}.streak{color:var(--accent);font-size:12px;white-space:nowrap}
.lane{height:7px;background:#292C20;border-radius:99px;overflow:hidden;margin-top:18px}.lane-fill{height:100%;background:var(--accent);border-radius:99px}.lane-caption{text-align:right;color:var(--dim);font-size:11px;margin-top:7px}.link{background:none;border:0;color:var(--dim);cursor:pointer;padding:0}.text-input{width:100%;background:#10110D;color:var(--text);border:1px solid var(--border);border-radius:7px;padding:8px 10px;outline:none}
.calendar{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:12px}.calendar-head{display:grid;grid-template-columns:32px 1fr 32px;align-items:center;text-align:center;margin-bottom:10px}.calendar-title{font-family:"Space Grotesk",sans-serif;font-size:14px;font-weight:600}.calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.calendar-weekday{text-align:center;color:var(--dim);font-size:10px;padding-bottom:4px}.calendar-day{height:42px;min-height:42px;position:relative;display:flex;align-items:center;justify-content:center;border:1px solid transparent;border-radius:7px;font-size:12px}.calendar-day.today{border-color:var(--border)}.calendar-day.has-run{background:var(--adim)}.calendar-check{position:absolute;right:4px;bottom:3px;width:13px;height:13px;color:var(--accent)}.empty-day{visibility:hidden}
.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.run-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--border)}.run-row:last-child{border-bottom:0}.run-date{color:var(--dim);font-size:11px}.run-distance{font-family:"Space Grotesk",sans-serif;font-size:16px;font-weight:600}.run-right{display:flex;align-items:center;gap:8px}.run-time{font-family:"Space Grotesk",sans-serif;font-size:15px}.run-pace{color:var(--dim);font-size:11px}.empty{color:var(--dim);font-size:13px;padding:20px 0;text-align:center}
.range-row{display:flex;gap:6px;margin-bottom:12px}.range-btn{flex:1;border:1px solid var(--border);background:var(--surface);color:var(--dim);border-radius:7px;padding:7px 4px;font-size:11px;cursor:pointer}.range-btn.active{color:var(--accent);border-color:var(--accent)}.chart{height:170px;display:flex;align-items:flex-end;gap:4px}.bar-wrap{flex:1;height:100%;display:flex;align-items:flex-end;justify-content:center}.bar{width:100%;max-width:18px;background:var(--accent);border-radius:3px 3px 0 0;min-height:2px}
.pr-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.pr-card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:14px;min-height:112px}.pr-label{color:var(--dim);font-size:11px;margin-bottom:10px}.pr-time{display:block;background:none;border:0;padding:0;font-family:"Space Grotesk",sans-serif;font-size:22px;font-weight:600;cursor:pointer;text-align:left}.pr-pace{color:var(--dim);font-size:10px;margin-top:5px}.pr-delete{position:absolute;right:6px;top:6px;color:var(--dim)}
.modal-back{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:20}.modal{width:100%;max-width:480px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px}.modal h2{margin-bottom:16px}.field{margin-bottom:12px}.field label{display:block;color:var(--dim);font-size:11px;margin-bottom:5px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.error{color:#ff7d7d;font-size:12px;margin-top:8px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:64px;background:rgba(23,25,15,.97);border-top:1px solid var(--border);display:grid;grid-template-columns:repeat(3,1fr);z-index:10}.nav-btn{border:0;background:none;color:var(--dim);cursor:pointer;font-size:11px}.nav-btn.active{color:var(--accent)}.nav-icon{display:block;font-size:17px;margin-bottom:2px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LS={runs:"runtracker_runs",prs:"runtracker_prs",goal:"runtracker_goal"};
const DEFAULT_PRS=[
{id:"pr-mile",label:"Mile",distance:1,timeSec:null},
{id:"pr-15",label:"1.5 mi",distance:1.5,timeSec:null},
{id:"pr-2",label:"2 mi",distance:2,timeSec:null},
{id:"pr-5k",label:"5K",distance:3.10686,timeSec:null}
];

function load(k,f){try{let x=localStorage.getItem(k);return x?JSON.parse(x):f}catch(e){return f}}
function save(k,v){localStorage.setItem(k,JSON.stringify(v))}
let state={
runs:load(LS.runs,[]),prs:load(LS.prs,DEFAULT_PRS),goal:load(LS.goal,20),
page:"home",chartRange:"10w",calendarMonth:new Date().getMonth(),calendarYear:new Date().getFullYear(),
showAddRun:false,showAddPr:false,editingGoal:false,editingPrId:null,editingRunId:null,error:""
};
function setState(x){state={...state,...x};render()}
function esc(s){return String(s??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function today(){return new Date().toISOString().slice(0,10)}
function fmt(sec){sec=Math.round(Number(sec));if(!isFinite(sec))return"—";let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`:`${m}:${String(s).padStart(2,"0")}`}
function time(v){v=String(v).trim();if(!v)return null;let p=v.split(":").map(Number);if(p.some(x=>!isFinite(x)))return null;if(p.length===3)return p[0]*3600+p[1]*60+p[2];if(p.length===2)return p[0]*60+p[1];return p.length===1?p[0]:null}
function pace(sec,distance){return fmt(Number(sec)/Number(distance))+"/mi"}
function check(n=16){return`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>`}
function plus(n=16){return`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`}
function x(n=16){return`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>`}
function pencil(n=13){return`<svg width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg>`}
function flame(){return"🔥"}

function monthKey(y,m){return`${y}-${String(m+1).padStart(2,"0")}`}
function getGoal(y,m){
 if(typeof state.goal==="number")return state.goal;
 return state.goal?.[monthKey(y,m)]??state.goal?.[monthKey(new Date().getFullYear(),new Date().getMonth())]??20
}
function setGoal(v){
 let goals=typeof state.goal==="object"&&state.goal!==null?{...state.goal}:{[monthKey(new Date().getFullYear(),new Date().getMonth())]:Number(state.goal)||20};
 goals[monthKey(state.calendarYear,state.calendarMonth)]=Number(v)||0;
 state.goal=goals;save(LS.goal,goals);setState({editingGoal:false})
}
function goalEdit(goal){return`<div style="display:flex;gap:6px;justify-content:flex-end"><input class="text-input" id="goal-input" type="number" min="0" value="${goal}" style="width:80px;padding:5px 7px;min-height:30px"><button class="btn-icon" onclick="setGoal(document.getElementById('goal-input').value)">${check()}</button><button class="btn-icon" onclick="setState({editingGoal:false})">${x()}</button></div>`}

/* PR logic */
function actualPB(p){
 let runs=state.runs.filter(r=>{
  let d=Number(r.distance),target=Number(p.distance);
  return d>0&&target>0&&Math.abs(d-target)<=Math.max(.01,target*.005)&&Number(r.timeSec)>0;
 });
 return runs.length?Math.min(...runs.map(r=>Number(r.timeSec))):null;
}
function estimate(p){
 let best=null,target=Number(p.distance);
 state.runs.forEach(r=>{
  let d=Number(r.distance),t=Number(r.timeSec);
  if(d>0&&t>0&&target>0){
   let predicted=t*Math.pow(target/d,1.06);
   if(best===null||predicted<best)best=predicted;
  }
 });
 return best?Math.round(best):null;
}
function prCard(p){
 let actual=actualPB(p);
 let t=actual||(!actual&&p.timeSec?p.timeSec:estimate(p));
 let est=!actual&&!p.timeSec&&!!t;
 if(state.editingPrId===p.id)return`<div class="pr-card"><button class="btn-icon pr-delete" onclick="deletePr('${p.id}')">${x(12)}</button><div class="pr-label">${esc(p.label)}</div><input class="text-input" id="pri-${p.id}" placeholder="mm:ss" value="${p.timeSec?fmt(p.timeSec):""}" style="width:100%;font-size:15px;padding:6px 8px;min-height:34px;margin-bottom:6px"><div><button class="btn-icon" onclick="let s=time(document.getElementById('pri-${p.id}').value);if(s)updatePr('${p.id}',s)">${check()}</button><button class="btn-icon" onclick="setState({editingPrId:null})">${x()}</button></div></div>`;
 return`<div class="pr-card"><button class="btn-icon pr-delete" onclick="deletePr('${p.id}')">${x(12)}</button><div class="pr-label">${esc(p.label)}</div><button class="pr-time" onclick="setState({editingPrId:'${p.id}'})">${t?fmt(t):"—"}${est?" Est.":""}</button><div class="pr-pace">${t?"pace "+pace(t,p.distance):"tap to set"}</div></div>`
}
function updatePr(id,s){state.prs=state.prs.map(p=>p.id===id?{...p,timeSec:s}:p);save(LS.prs,state.prs);setState({editingPrId:null})}
function deletePr(id){state.prs=state.prs.filter(p=>p.id!==id);save(LS.prs,state.prs);setState({editingPrId:null})}
function addPr(label,distance){
 label=String(label).trim();distance=Number(distance);
 if(!label||!distance||distance<=0)return;
 state.prs.push({id:"pr-"+Date.now(),label,distance,timeSec:null});
 save(LS.prs,state.prs);setState({showAddPr:false})
}

function saveRun(){
 let date=document.getElementById("run-date").value,distance=Number(document.getElementById("run-distance").value),timeSec=time(document.getElementById("run-time").value);
 if(!date||!distance||distance<=0||!timeSec){setState({error:"Enter a date, distance, and time."});return}
 if(state.editingRunId)state.runs=state.runs.map(r=>r.id===state.editingRunId?{...r,date,distance,timeSec}:r);
 else state.runs.push({id:"run-"+Date.now(),date,distance,timeSec});
 state.runs.sort((a,b)=>a.date.localeCompare(b.date));save(LS.runs,state.runs);
 setState({showAddRun:false,editingRunId:null,error:""})
}
function deleteRun(id){state.runs=state.runs.filter(r=>r.id!==id);save(LS.runs,state.runs);setState({editingRunId:null})}

function runModal(){
 let editing=state.editingRunId?state.runs.find(r=>r.id===state.editingRunId):null;
 return`<div class="modal-back"><div class="modal"><h2>${editing?"Edit run":"Log a run"}</h2>
 <div class="field"><label>Date</label><input class="text-input" id="run-date" type="date" value="${editing?editing.date:today()}"></div>
 <div class="field"><label>Distance (mi)</label><input class="text-input" id="run-distance" type="number" step="0.01" min="0" value="${editing?editing.distance:""}"></div>
 <div class="field"><label>Time</label><input class="text-input" id="run-time" placeholder="mm:ss" value="${editing?fmt(editing.timeSec):""}"></div>
 ${state.error?`<div class="error">${esc(state.error)}</div>`:""}
 <div class="modal-actions"><button class="btn" onclick="setState({showAddRun:false,editingRunId:null,error:''})">Cancel</button>${editing?`<button class="btn" onclick="deleteRun('${editing.id}')">Delete</button>`:""}<button class="btn btn-primary" onclick="saveRun()">${editing?"Save":"Add run"}</button></div></div></div>`
}
function prModal(){return`<div class="modal-back"><div class="modal"><h2>Add personal best</h2><div class="field"><label>Name</label><input class="text-input" id="new-pr-label" placeholder="10K"></div><div class="field"><label>Distance (mi)</label><input class="text-input" id="new-pr-distance" type="number" step="0.00001" min="0" placeholder="6.21371"></div><div class="modal-actions"><button class="btn" onclick="setState({showAddPr:false})">Cancel</button><button class="btn btn-primary" onclick="addPr(document.getElementById('new-pr-label').value,document.getElementById('new-pr-distance').value)">Add</button></div></div></div>`}

function changeMonth(n){let d=new Date(state.calendarYear,state.calendarMonth+n,1);setState({calendarMonth:d.getMonth(),calendarYear:d.getFullYear()})}
function calendar(){
 let y=state.calendarYear,m=state.calendarMonth,first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),off=(first.getDay()+6)%7,set=new Set(state.runs.map(r=>r.date)),cells="";
 for(let i=0;i<off;i++)cells+=`<div class="calendar-day empty-day"></div>`;
 for(let d=1;d<=days;d++){let date=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`,run=set.has(date);cells+=`<div class="calendar-day ${run?"has-run":""} ${date===today()?"today":""}">${d}${run?`<span class="calendar-check">${check(13)}</span>`:""}</div>`}
 let title=new Date(y,m,1).toLocaleDateString(undefined,{month:"long",year:"numeric"});
 return`<section class="block"><div class="calendar"><div class="calendar-head"><button class="btn-icon" onclick="changeMonth(-1)">‹</button><div class="calendar-title">${title}</div><button class="btn-icon" onclick="changeMonth(1)">›</button></div><div class="calendar-weekdays">${"MTWTFSS".split("").map(x=>`<div class="calendar-weekday">${x}</div>`).join("")}</div><div class="calendar-grid">${cells}</div></div></section>`
}
function streak(){
 if(!state.runs.length)return 0;let dates=new Set(state.runs.map(r=>r.date)),d=new Date();
 if(!dates.has(today())){d.setDate(d.getDate()-1);if(!dates.has(d.toISOString().slice(0,10)))return 0}
 let n=0;while(dates.has(d.toISOString().slice(0,10))){n++;d.setDate(d.getDate()-1)}return n
}
function home(){
 let y=state.calendarYear,m=state.calendarMonth,key=monthKey(y,m),miles=state.runs.filter(r=>r.date.startsWith(key)).reduce((s,r)=>s+Number(r.distance||0),0),goal=getGoal(y,m),pct=goal?Math.min(100,miles/goal*100):0,s=streak();
 return`<header class="top"><div><h1>Run log</h1><p class="sub">Track distance, pace, and personal bests.</p></div><button class="btn btn-primary" onclick="setState({showAddRun:true})">${plus()} Log a run</button></header>
 ${calendar()}<section class="card hero"><div class="hero-top"><div><div class="hero-number">${miles.toFixed(1)} <span class="hero-unit">mi</span></div><div class="hero-label">this month</div></div>${s?`<div class="streak">${flame()} ${s} day${s===1?"":"s"} running</div>`:""}</div>
 <div class="lane"><div class="lane-fill" style="width:${pct}%"></div></div><div class="lane-caption">${state.editingGoal?goalEdit(goal):`<button class="link" onclick="setState({editingGoal:true})">goal: ${goal} mi/month ${pencil()}</button>`}</div></section>
 <section class="card"><div class="section-head"><h2>Data</h2></div><div style="display:flex;gap:8px"><button class="btn" style="flex:1" onclick="document.getElementById('import-file').click()">Import JSON</button><button class="btn" style="flex:1" onclick="exportJSON()">Export JSON</button></div><input id="import-file" type="file" accept=".json,application/json" style="display:none" onchange="importJSON(this.files[0])"></section>`
}
function history(){
 let runs=[...state.runs].sort((a,b)=>b.date.localeCompare(a.date)),weeks=state.chartRange==="10w"?10:state.chartRange==="3m"?13:52,now=new Date(),values=[],max=0;
 for(let i=weeks-1;i>=0;i--){let end=new Date(now);end.setDate(end.getDate()-i*7);let start=new Date(end);start.setDate(start.getDate()-6);let total=runs.reduce((s,r)=>{let d=new Date(r.date+"T00:00:00");return d>=start&&d<=end?s+Number(r.distance||0):s},0);values.push({total,label:`${end.getMonth()+1}/${end.getDate()}`});max=Math.max(max,total)}
 return`<header class="top"><div><h1>History</h1><p class="sub">Your logged runs.</p></div><button class="btn btn-primary" onclick="setState({showAddRun:true})">${plus()} Log a run</button></header>
 <section class="card"><div class="section-head"><h2>Mileage</h2></div><div class="range-row"><button class="range-btn ${state.chartRange==="10w"?"active":""}" onclick="setState({chartRange:'10w'})">10 weeks</button><button class="range-btn ${state.chartRange==="3m"?"active":""}" onclick="setState({chartRange:'3m'})">3 months</button><button class="range-btn ${state.chartRange==="1y"?"active":""}" onclick="setState({chartRange:'1y'})">1 year</button></div><div class="chart">${values.map(v=>`<div class="bar-wrap"><div class="bar" style="height:${max?Math.max(2,v.total/max*100):2}%"></div></div>`).join("")}</div></section>
 <section class="card"><div class="section-head"><h2>Runs</h2></div>${runs.length?runs.map(r=>`<div class="run-row"><div><div class="run-distance">${Number(r.distance).toFixed(2)} mi</div><div class="run-date">${new Date(r.date+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"})}</div></div><div class="run-right"><div><div class="run-time">${fmt(r.timeSec)}</div><div class="run-pace">${pace(r.timeSec,r.distance)}</div></div><button class="btn-icon" onclick="setState({editingRunId:'${r.id}'})">${pencil()}</button></div></div>`).join(""):`<div class="empty">No runs logged yet.</div>`}</section>`
}
function prs(){return`<header class="top"><div><h1>Personal bests</h1><p class="sub">Your fastest times and estimates.</p></div></header><section class="block"><div class="pr-grid">${state.prs.map(prCard).join("")}</div><button class="btn add-pr" style="margin-top:10px;width:100%" onclick="setState({showAddPr:true})">${plus()} Add personal best</button></section>`}

function exportJSON(){
 let blob=new Blob([JSON.stringify({runs:state.runs,prs:state.prs,goal:state.goal},null,2)],{type:"application/json"}),a=document.createElement("a");
 a.href=URL.createObjectURL(blob);a.download="run-log.json";a.click();URL.revokeObjectURL(a.href)
}
function importJSON(file){
 if(!file)return;
 let reader=new FileReader();
 reader.onload=e=>{
  try{
   let d=JSON.parse(e.target.result);
   if(Array.isArray(d.runs)){state.runs=d.runs;save(LS.runs,state.runs)}
   if(Array.isArray(d.prs)){state.prs=d.prs.map(p=>({...p,timeSec:p.timeSec?Number(p.timeSec):null}));save(LS.prs,state.prs)}
   if(typeof d.goal==="number"||typeof d.goal==="object"){state.goal=d.goal;save(LS.goal,state.goal)}
   render()
  }catch(err){alert("Invalid JSON file.")}
 };
 reader.readAsText(file)
}

document.addEventListener("click",e=>{let b=e.target.closest(".nav-btn");if(b)setState({page:b.dataset.page})});
function render(){let content=state.page==="home"?home():state.page==="history"?history():prs();document.getElementById("app").innerHTML=`<div class="app">${content}</div><nav class="nav"><button class="nav-btn ${state.page==="home"?"active":""}" data-page="home"><span class="nav-icon">⌂</span>Home</button><button class="nav-btn ${state.page==="history"?"active":""}" data-page="history"><span class="nav-icon">☰</span>History</button><button class="nav-btn ${state.page==="prs"?"active":""}" data-page="prs"><span class="nav-icon">★</span>PRs</button></nav>${state.showAddRun||state.editingRunId?runModal():""}${state.showAddPr?prModal():""}`}
render();
</script>
</body>
</html>
